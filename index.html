<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Exam Timetable</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14181f;--mut:#5b6573;--ac:#0b6b3a;--acx:#fff;--bd:#d5dae1;--err:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#1a2027;--tx:#eef1f4;--mut:#9aa5b1;--ac:#37b878;--acx:#06210f;--bd:#2c3540;--err:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#1a2027;--tx:#eef1f4;--mut:#9aa5b1;--ac:#37b878;--acx:#06210f;--bd:#2c3540;--err:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{height:100%;max-width:640px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
h1{font-size:1.25rem;margin:0}
section{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
#out{display:none}
.row{display:flex;gap:8px}
label.file{flex:1;border:2px dashed var(--bd);border-radius:12px;padding:16px 8px;text-align:center;color:var(--mut);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;background:var(--card)}
label.file.ok{border-style:solid;border-color:var(--ac);color:var(--tx)}
input[type=file]{display:none}
textarea{flex:1;min-height:0;width:100%;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);color:var(--tx);font:inherit;text-transform:uppercase;resize:none}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--acx);width:100%;cursor:pointer}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.st{color:var(--mut);font-size:.85rem;min-height:1.2em}
.st.err{color:var(--err)}
#wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--bd);border-radius:10px;-webkit-overflow-scrolling:touch}
#wrap img{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main>
<h1>My Exam Timetable</h1>
<section id="in">
<div class="row">
<label class="file" for="pdf" id="l1">General timetable PDF</label>
<label class="file" for="slp" id="l2">Exam slip image</label>
</div>
<input id="pdf" type="file" accept="application/pdf,.pdf">
<input id="slp" type="file" accept="image/*,application/pdf,.pdf">
<textarea id="codes" placeholder="Course codes: read from your slip, or type them" spellcheck="false" autocapitalize="characters"></textarea>
<div class="st" id="st"></div>
<button id="go" disabled>Generate</button>
</section>
<section id="out">
<div id="wrap"><img id="img" alt="Your personal exam timetable"></div>
<div class="st" id="note"></div>
<div class="row"><button id="back" class="alt">Edit</button><button id="save">Save JPG</button></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const MON={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
const CODE=/^((?:NOUN-)?[A-Z]{3,4}\d{3}[A-Z]?(?:-[AB])?)(?:\s+([\s\S]*))?$/;
const TIME=/\d{1,2}(?::\d{2})?\s*[ap]m/gi;
const DATE=/(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),?\s*(\d{1,2})\s*(?:st|nd|rd|th)?\s+([A-Za-z]+),?\s*(\d{4})/i;
let papers=null,blob=null,imgUrl=null;

// ---------- library loading: local ./vendor first, CDN as fallback ----------
const LIB={
  pdf:{srcs:['vendor/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'],
       workers:['vendor/pdf.worker.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js']},
  ocr:{srcs:['vendor/tesseract/tesseract.min.js','https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js']}
};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok(src);s.onerror=()=>{s.remove();no(new Error('load '+src))};document.head.appendChild(s)})}
function loadAny(srcs){return srcs.reduce((p,s)=>p.catch(()=>loadScript(s)),Promise.reject())}
let pdfReady=null;
function ensurePdf(){
  return pdfReady||(pdfReady=loadAny(LIB.pdf.srcs).then(src=>{
    pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdf.workers[LIB.pdf.srcs.indexOf(src)];
  }).catch(e=>{pdfReady=null;throw e}));
}

function lineGroup(arr,tol){
  const a=arr.slice().sort((p,q)=>q.y-p.y),L=[];
  for(const it of a){const l=L[L.length-1];if(l&&Math.abs(l.y-it.y)<=tol)l.items.push(it);else L.push({y:it.y,items:[it]})}
  L.forEach(l=>l.items.sort((p,q)=>p.x-q.x));return L;
}
function normTime(s){
  const m=s.replace(/\s+/g,'').toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?([ap])m$/);
  let h=+m[1],mi=+(m[2]||0);const pm=m[3]==='p';
  const label=h+(mi?':'+String(mi).padStart(2,'0'):'')+' '+(pm?'PM':'AM');
  if(pm&&h<12)h+=12;if(!pm&&h===12)h=0;
  return {label,min:h*60+mi};
}
function clusterX(xs){
  const s=xs.slice().sort((a,b)=>a-b),cl=[];
  for(const x of s){const c=cl[cl.length-1];if(c&&x-c.last<30){c.v.push(x);c.last=x}else cl.push({v:[x],last:x})}
  return cl.map(c=>c.v.reduce((a,b)=>a+b,0)/c.v.length);
}

async function parsePdf(buf,onPage){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const recs=[],seen=new Set();let days=0,orphan=0;
  for(let n=1;n<=pdf.numPages;n++){
    onPage&&onPage(n,pdf.numPages);
    const pg=await pdf.getPage(n),tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width||0}));
    const lines=lineGroup(its,3);
    const labels=[];
    for(const l of lines){
      const segs=[];
      for(const it of l.items){
        const g=segs[segs.length-1];
        if(g&&it.x-g.end<14){g.s+=' '+it.s;g.end=it.x+it.w}else segs.push({s:it.s,x:it.x,end:it.x+it.w,y:l.y});
      }
      for(const g of segs){
        const m=g.s.match(DATE);
        if(m&&MON[m[3].toLowerCase()]!==undefined)labels.push({x:g.x,y:g.y,wd:m[1],d:+m[2],mo:MON[m[3].toLowerCase()],yr:+m[4]});
      }
    }
    const toks=[];
    for(const it of its){
      if(it.s.replace(TIME,'').replace(/[\s,]/g,'')!=='')continue;
      for(const m of it.s.matchAll(TIME))toks.push({x:it.x+it.w*(m.index+m[0].length/2)/it.s.length,y:it.y,t:m[0]});
    }
    const triples=[];
    for(const l of lineGroup(toks,3))for(let i=0;i+2<l.items.length;i+=3){
      const g=l.items.slice(i,i+3);triples.push({y:l.y,c:g.map(k=>k.x),t:g.map(k=>normTime(k.t))});
    }
    const pairs=[];
    labels.forEach((lb,li)=>triples.forEach((tr,ti)=>pairs.push({li,ti,d:Math.abs(lb.y-tr.y)+0.2*Math.abs(lb.x-tr.c[0])})));
    pairs.sort((a,b)=>a.d-b.d);
    const uL=new Set(),uT=new Set();
    for(const p of pairs){if(uL.has(p.li)||uT.has(p.ti))continue;uL.add(p.li);uT.add(p.ti);triples[p.ti].lb=labels[p.li]}
    const cells=[];
    for(const l of lines){
      let cur=null;
      for(const it of l.items){
        const m=it.s.match(CODE);
        if(m){cur={code:m[1],title:(m[2]||'').trim(),x:it.x,y:l.y,end:it.x+it.w};cells.push(cur)}
        else if(cur&&it.x-cur.end<25){cur.title+=(cur.title?' ':'')+it.s;cur.end=it.x+it.w}
        else cur=null;
      }
    }
    const byT=new Map();
    for(const c of cells){
      let best=null,bd=1e9;
      for(const tr of triples){
        const d=tr.y-c.y;
        if(d>=-4&&d<bd&&c.x>=tr.c[0]-120&&c.x<=tr.c[2]+120){bd=d;best=tr}
      }
      if(!best){orphan++;continue}
      if(!byT.has(best))byT.set(best,[]);byT.get(best).push(c);
    }
    for(const tr of triples)if(tr.lb)days++;
    for(const [tr,cs] of byT){
      if(!tr.lb){orphan+=cs.length;continue}
      const cl=clusterX(cs.map(c=>c.x));
      const m1=(tr.c[0]+tr.c[1])/2,m2=(tr.c[1]+tr.c[2])/2;
      for(const c of cs){
        let slot;
        if(cl.length===3){slot=cl.reduce((b,v,i)=>Math.abs(v-c.x)<Math.abs(cl[b]-c.x)?i:b,0)}
        else slot=c.x<m1?0:c.x<m2?1:2;
        const lb=tr.lb,dt=new Date(Date.UTC(lb.yr,lb.mo,lb.d)),iso=dt.toISOString().slice(0,10);
        const tm=tr.t[slot],key=iso+'|'+tm.label+'|'+c.code;
        if(seen.has(key))continue;seen.add(key);
        recs.push({code:c.code,base:c.code.replace(/^NOUN-/,'').replace(/-[AB]$/,''),batch:(c.code.match(/-([AB])$/)||[])[1]||'',
          noun:/^NOUN-/.test(c.code),title:c.title,iso,dt,wd:lb.wd,time:tm.label,tmin:tm.min});
      }
    }
  }
  return {recs,days,orphan};
}

function parseCodes(txt){
  const out=[];
  for(const m of txt.toUpperCase().matchAll(/\b(?:NOUN-)?[A-Z]{3,4}\s?\d{3}[A-Z]?(?:-[AB])?\b/g)){
    const b=m[0].replace(/\s/g,'').replace(/^NOUN-/,'').replace(/-[AB]$/,'');
    if(!out.includes(b))out.push(b);
  }
  return out;
}
function build(recs,codes){
  const hit=[],missing=[];
  for(const b of codes){
    const m=recs.filter(r=>r.base===b);
    if(!m.length){missing.push(b);continue}
    for(const r of m){
      const k=hit.find(h=>h.iso===r.iso&&h.time===r.time&&h.base===r.base);
      if(k){if(k.noun&&!r.noun)Object.assign(k,r);continue}
      hit.push({...r});
    }
  }
  hit.sort((a,b)=>a.iso<b.iso?-1:a.iso>b.iso?1:a.tmin-b.tmin||a.base.localeCompare(b.base));
  const g={};hit.forEach(h=>(g[h.iso+'|'+h.time]=g[h.iso+'|'+h.time]||[]).push(h));
  hit.forEach(h=>h.clash=g[h.iso+'|'+h.time].length>1);
  return {hit,missing};
}

// ---------- drawing ----------
const W=1080,P=48;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,t,maxW,maxL){
  const words=t.split(/\s+/),ls=[];let cur='';
  for(const w of words){const n=cur?cur+' '+w:w;if(c.measureText(n).width>maxW&&cur){ls.push(cur);cur=w}else cur=n}
  if(cur)ls.push(cur);
  if(ls.length>maxL){ls.length=maxL;let l=ls[maxL-1];while(c.measureText(l+'…').width>maxW&&l.length>1)l=l.slice(0,-1);ls[maxL-1]=l+'…'}
  return ls;
}
const FF='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function draw(hit,missing,nClash){
  const CH=150,GAP=14,HB=60;
  const groups=[];
  for(const h of hit){const g=groups[groups.length-1];if(g&&g.iso===h.iso)g.items.push(h);else groups.push({iso:h.iso,dt:h.dt,wd:h.wd,items:[h]})}
  const t=document.createElement('canvas').getContext('2d');
  t.font='24px '+FF;
  const mtxt=missing.length?wrap(t,'Not found in the timetable: '+missing.join(', '),W-2*P-40,6):[];
  const head=200,foot=130+(mtxt.length?mtxt.length*34+50:0);
  const body=groups.reduce((s,g)=>s+HB+12+g.items.length*(CH+GAP)+20,0)||(CH+GAP);
  const H=head+body+foot;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#f4f6f8';c.fillRect(0,0,W,H);
  c.fillStyle='#0b6b3a';c.fillRect(0,0,W,150);
  c.fillStyle='#fff';c.textBaseline='alphabetic';
  c.font='bold 54px '+FF;c.fillText('My Exam Timetable',P,72);
  c.font='26px '+FF;c.fillText('NOUN · 2026_2 E-Exam',P,118);
  c.fillStyle='#14181f';c.font='24px '+FF;
  c.fillText(hit.length+' paper'+(hit.length===1?'':'s')+(nClash?' · '+nClash+' clash'+(nClash===1?'':'es'):''),P,188);
  let y=head;
  if(!hit.length){c.fillStyle='#5b6573';c.fillText('No matching papers found.',P,y+60);y+=CH+GAP}
  for(const g of groups){
    const gc=g.items.some(i=>i.clash);
    const wd=g.wd.charAt(0).toUpperCase()+g.wd.slice(1).toLowerCase();
    c.fillStyle=gc?'#fdeaea':'#e1f0e7';rr(c,P,y,W-2*P,HB,14);c.fill();
    c.fillStyle=gc?'#d32f2f':'#0b6b3a';c.font='bold 34px '+FF;c.textAlign='left';
    c.fillText(wd+', '+MN[g.dt.getUTCMonth()]+' '+g.dt.getUTCDate(),P+22,y+42);
    c.font='24px '+FF;c.textAlign='right';
    c.fillText(g.items.length+(g.items.length===1?' paper':' papers')+(gc?' · CLASH':''),W-P-22,y+40);
    c.textAlign='left';
    y+=HB+12;
    for(const h of g.items){
      c.fillStyle=h.clash?'#fff4f4':'#fff';rr(c,P,y,W-2*P,CH,18);c.fill();
      c.lineWidth=h.clash?6:2;c.strokeStyle=h.clash?'#d32f2f':'#d5dae1';rr(c,P,y,W-2*P,CH,18);c.stroke();
      c.fillStyle=h.clash?'#d32f2f':'#0b6b3a';rr(c,P+18,y+18,170,CH-36,14);c.fill();
      c.fillStyle='#fff';c.textAlign='center';c.font='bold 36px '+FF;
      c.fillText(h.time,P+103,y+CH/2+13);
      c.textAlign='left';
      const tx=P+216;
      c.fillStyle='#14181f';c.font='bold 40px '+FF;c.fillText(h.code,tx,y+56);
      const cw=c.measureText(h.code).width;
      if(h.batch){
        c.font='bold 20px '+FF;const bt='Batch '+h.batch,bw=c.measureText(bt).width+22;
        c.fillStyle='#e3ebf5';rr(c,tx+cw+14,y+28,bw,32,16);c.fill();
        c.fillStyle='#2a3b52';c.fillText(bt,tx+cw+25,y+51);
      }
      c.fillStyle='#14181f';c.font='28px '+FF;
      wrap(c,h.title||'(title not read)',W-P-24-tx,2).forEach((l,i)=>c.fillText(l,tx,y+94+i*34));
      if(h.clash){
        c.font='bold 20px '+FF;const w2=c.measureText('CLASH').width+26;
        c.fillStyle='#d32f2f';rr(c,W-P-20-w2,y+22,w2,30,15);c.fill();
        c.fillStyle='#fff';c.fillText('CLASH',W-P-7-w2,y+44);
      }
      y+=CH+GAP;
    }
    y+=20;
  }
  if(mtxt.length){
    const bh=mtxt.length*34+30;
    c.fillStyle='#fff4e5';rr(c,P,y,W-2*P,bh,14);c.fill();
    c.fillStyle='#8a4b00';c.font='24px '+FF;
    mtxt.forEach((l,i)=>c.fillText(l,P+20,y+40+i*34));
    y+=bh+GAP;
  }
  c.fillStyle='#5b6573';c.font='22px '+FF;
  c.fillText('Please confirm all dates and times against the official NOUN timetable.',P,y+40);
  c.fillText('Clashing papers are listed as they appear; nothing has been moved.',P,y+74);
  return new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',0.92));
}

// ---------- UI ----------
const st=(t,e)=>{const x=$('st');x.textContent=t;x.className='st'+(e?' err':'')};
const FIX_L={'0':'O','1':'I','5':'S','8':'B','2':'Z'},FIX_D={O:'0',I:'1',L:'1',S:'5',B:'8',Z:'2',G:'6'};
function codesFromText(txt){
  const out=[];
  for(let tok of txt.toUpperCase().split(/[^A-Z0-9-]+/)){
    tok=tok.replace(/^NOUN-/,'').replace(/-[AB]$/,'');
    if(tok.length<6||tok.length>7)continue;
    const l=[...tok.slice(0,-3)].map(c=>/[A-Z]/.test(c)?c:FIX_L[c]||'?').join('');
    const d=[...tok.slice(-3)].map(c=>/\d/.test(c)?c:FIX_D[c]||'?').join('');
    if(/^[A-Z]{3,4}$/.test(l)&&/^\d{3}$/.test(d)&&!out.includes(l+d))out.push(l+d);
  }
  return out;
}
async function readSlipPdf(file){
  await ensurePdf();
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let txt='';
  for(let n=1;n<=pdf.numPages;n++){
    const tc=await (await pdf.getPage(n)).getTextContent();
    txt+=tc.items.map(i=>i.str).join(' ')+' ';
  }
  return codesFromText(txt);
}
async function readSlip(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))return readSlipPdf(file);
  const bmp=await createImageBitmap(file),k=Math.max(1,Math.min(3,2000/bmp.width));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
  if('TextDetector' in window){
    try{const r=await new TextDetector().detect(cv),c=codesFromText(r.map(x=>x.rawValue).join(' '));if(c.length)return c}catch(e){}
  }
  let src=null;
  if(!window.Tesseract)src=await loadAny(LIB.ocr.srcs);
  const local=src===LIB.ocr.srcs[0];
  const opts=local?{workerPath:'vendor/tesseract/worker.min.js',corePath:'vendor/tesseract/',langPath:'vendor/tesseract/'}:{};
  const w=await Tesseract.createWorker('eng',1,opts);
  try{const {data}=await w.recognize(cv);return codesFromText(data.text)}finally{await w.terminate()}
}
$('slp').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  $('l2').textContent=f.name;$('l2').classList.remove('ok');
  try{
    st('Reading slip…');
    const c=await readSlip(f);
    if(!c.length){st('No course codes found. Type them in.',1);return}
    const all=parseCodes($('codes').value);c.forEach(x=>{if(!all.includes(x))all.push(x)});
    $('codes').value=all.join(', ');$('l2').classList.add('ok');
    st('Found '+c.length+' code'+(c.length===1?'':'s')+'. Check them below.');
  }catch(err){console.error(err);st("Couldn't read the slip here. Type the codes instead.",1)}
  e.target.value='';
});
$('pdf').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  papers=null;$('go').disabled=true;$('l1').textContent=f.name;$('l1').classList.remove('ok');
  try{
    st('Loading PDF reader…');
    try{await ensurePdf()}catch(x){st('PDF reader failed to load. Check your connection and reload.',1);return}
    st('Reading PDF…');
    const r=await parsePdf(await f.arrayBuffer(),(n,t)=>st('Reading page '+n+' of '+t+'…'));
    if(!r.recs.length)throw new Error('No exam entries found. Is this the exam timetable PDF?');
    papers=r.recs;$('go').disabled=false;$('l1').classList.add('ok');
    st(r.recs.length+' papers, '+r.days+' days read'+(r.orphan?' ('+r.orphan+' unplaced)':'')+'.');
  }catch(err){console.error(err);st('Could not read this PDF: '+(err.message||err),1)}
  e.target.value='';
});
$('go').addEventListener('click',async()=>{
  const codes=parseCodes($('codes').value);
  if(!codes.length){st('Enter at least one course code.',1);return}
  try{
    const {hit,missing}=build(papers,codes);
    const nClash=new Set(hit.filter(h=>h.clash).map(h=>h.iso+h.time)).size;
    blob=await draw(hit,missing,nClash);
    if(imgUrl)URL.revokeObjectURL(imgUrl);
    imgUrl=URL.createObjectURL(blob);$('img').src=imgUrl;
    $('note').textContent=hit.length+' papers'+(nClash?' · '+nClash+' clash'+(nClash===1?'':'es'):'')+(missing.length?' · not found: '+missing.join(', '):'')+'. Press and hold the image if Save fails.';
    $('in').style.display='none';$('out').style.display='flex';$('wrap').scrollTop=0;
  }catch(err){console.error(err);st('Something went wrong: '+(err.message||err),1)}
});
$('back').addEventListener('click',()=>{$('out').style.display='none';$('in').style.display='flex'});
$('save').addEventListener('click',async()=>{
  if(!blob)return;const name='My-Exam-Timetable.jpg';
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:blob});return}}catch(e){}
  try{const f=new File([blob],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=imgUrl;a.download=name;document.body.appendChild(a);a.click();a.remove();
});
</script>
</body>
